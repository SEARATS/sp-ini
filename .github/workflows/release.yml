name: Build editor releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - name: Check release tag
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run package
      - name: Assemble editor downloads
        shell: pwsh
        run: ./scripts/release-assets.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: editor-downloads
          path: release/*
          if-no-files-found: error

  draft:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: draft-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: editor-downloads
          path: release
      - name: Attach downloads to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json; then
            test "$(jq -r .isDraft release-state.json)" = true
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --generate-notes --title "Sea Power INI $GITHUB_REF_NAME"
          fi
