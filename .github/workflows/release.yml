name: Build editor releases

on:
  pull_request:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - id: version
        shell: bash
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Check release tag
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm test
      - run: pnpm run test:fbx
      - run: python -m pip install UnityPy==1.25.4 pyinstaller==6.16.0
      - run: ./scripts/build-reader.ps1
      - run: ./dist/stock-reader/stock-reader.exe --self-test
      - run: pnpm run package
      - name: Assemble editor downloads
        shell: pwsh
        run: ./scripts/release-assets.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: editor-downloads
          path: release/*
          if-no-files-found: error
