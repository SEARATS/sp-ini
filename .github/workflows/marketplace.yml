name: Publish editor releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiet-period:
    name: Wait for 60 quiet minutes on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-quiet-period-main
      cancel-in-progress: true
    environment: release-quiet-period
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release quiet period elapsed."

  build:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release.yml

  github-release:
    needs: [build, quiet-period]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.quiet-period.result == 'success' || startsWith(github.ref, 'refs/tags/v'))
    concurrency: github-release-${{ needs.build.outputs.tag }}
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: editor-downloads
          path: release
      - name: Publish editor downloads
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [[ "$latest" != "$commit" ]]; then
              echo "A newer push restarted the release quiet period."
              exit 0
            fi
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-list -1 "$RELEASE_TAG")" != "$commit" ]; then
              echo "$RELEASE_TAG already belongs to an earlier commit. Build passed."
              exit 0
            fi
          fi

          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [ "$(jq -r .isDraft release-state.json)" = true ]; then
              gh release upload "$RELEASE_TAG" release/* --clobber
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" release/* --target "$commit" --draft --generate-notes --title "Sea Power INI $RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  marketplace:
    needs: [build, github-release]
    concurrency: marketplace-${{ needs.build.outputs.tag || github.ref }}
    if: >-
      always() && vars.PUBLISH_MARKETPLACE == 'true' &&
      (needs.github-release.outputs.publish == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - run: pnpm install --frozen-lockfile
      - name: Verify Marketplace trust without publishing
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "require('@vscode/vsce/out/oidc').getOIDCCredential(require('./package.json').publisher).then(() => console.log('Marketplace accepted the workflow identity.')).catch(() => { console.error('Marketplace credential exchange failed.'); process.exitCode = 1; })"
      - name: Publish the released VSIX
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          vsix="seapower-ini-$version.vsix"
          gh release download "v$version" --pattern "$vsix" --dir "$RUNNER_TEMP"
          pnpm exec vsce publish --oidc --skip-duplicate --packagePath "$RUNNER_TEMP/$vsix"
